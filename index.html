<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>초월자 강화확률 계산기</title>
    <style>
        :root { --gold: #f1c40f; --electric: #00d2ff; --bg: #0b0e14; --card: #161b22; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg); color: #e6edf3; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: var(--card); padding: 35px; border-radius: 24px; width: 100%; max-width: 450px; border: 1px solid #30363d; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        h1 { text-align: center; color: var(--gold); margin-bottom: 30px; font-size: 24px; letter-spacing: -1px; }
        .section { margin-bottom: 25px; padding: 20px; background: #0d1117; border-radius: 16px; border: 1px solid #30363d; }
        label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 12px; font-weight: 600; }
        select { width: 100%; padding: 12px; background: #161b22; border: 1px solid #444; color: white; border-radius: 10px; font-size: 16px; appearance: none; cursor: pointer; }
        
        /* 결과 영역 */
        .final-result { margin-top: 10px; padding: 30px 20px; border-radius: 20px; text-align: center; background: linear-gradient(145deg, rgba(241, 196, 15, 0.1), rgba(0, 0, 0, 0)); border: 1px solid var(--gold); position: relative; overflow: hidden; }
        .final-result::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(241, 196, 15, 0.05) 0%, transparent 70%); pointer-events: none; }
        
        .label-text { font-size: 14px; color: #8b949e; margin-bottom: 10px; }
        .value-text { font-size: 48px; font-weight: 800; color: var(--gold); text-shadow: 0 0 20px rgba(241, 196, 15, 0.4); }
        
        .info-text { font-size: 12px; color: #555; margin-top: 15px; line-height: 1.6; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>초월자 강화확률 계산기</h1>
    
    <div class="section">
        <label>강화 단계 선택</label>
        <select id="stage" onchange="update()">
            <option value="0.2">아비터 → 뮤탈 (기본 20%)</option>
            <option value="0.15">뮤탈 → 배틀 (기본 15%)</option>
        </select>
    </div>

    <div class="section grid">
        <div>
            <label>옵저버 (2회 지속)</label>
            <select id="obs" onchange="update()">
                <option value="1">미사용</option>
                <option value="2">사용 (2배)</option>
            </select>
        </div>
        <div>
            <label>강화 주문서</label>
            <select id="scroll" onchange="update()">
                <option value="0">미사용</option>
                <option value="0.08">8% 주문서</option>
                <option value="0.16">16% 주문서</option>
                <option value="0.32">32% 주문서</option>
                <option value="0.64">64% 주문서</option>
            </select>
        </div>
    </div>

    <div class="final-result">
        <div class="label-text">초월석 1개당 최종 성공 확률 (P)</div>
        <div id="P_val" class="value-text">41.67%</div>
        <div class="info-text">
            실패 시 65% 보존 규칙이 적용된<br>수학적 기대 확률입니다.
        </div>
    </div>

    <div style="text-align: center; margin-top: 25px;">
        <span style="font-size: 11px; color: #444; border: 1px solid #333; padding: 4px 10px; border-radius: 20px;">
            $P = \frac{p}{1 - 0.65(1 - p)}$
        </span>
    </div>
</div>

<script>
function update() {
    const base = parseFloat(document.getElementById('stage').value);
    const obsMult = parseFloat(document.getElementById('obs').value);
    const scrollAdd = parseFloat(document.getElementById('scroll').value);
    const r = 0.65; // 보존 확률

    // 1. p (단일 클릭 성공 확률) 내부 계산
    let p = (base * obsMult) + scrollAdd;
    if (p > 1) p = 1;

    // 2. P (등비급수 최종 확률) 계산
    let P = p / (1 - r * (1 - p));
    if (p >= 1) P = 1;

    // 화면 업데이트
    document.getElementById('P_val').innerText = (P * 100).toFixed(2) + "%";
}

// 초기 실행
update();
</script>

</body>
</html>
